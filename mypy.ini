[mypy]
# Static typing configuration for the CI "type check" gate (PR 6).
#
# The goal is a pragmatic baseline that catches real bugs without demanding a
# full annotation retrofit in one pass. Strictness can be ratcheted up module
# by module over time.

python_version = 3.12
namespace_packages = True
explicit_package_bases = True
ignore_missing_imports = True
follow_imports = normal
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_optional = True
check_untyped_defs = True
show_error_codes = True
pretty = True

# Migrations are generated code; don't type-check them.
exclude = (?x)(
    ^alembic/
    | ^tests/manual/
  )

# Third-party packages without bundled type stubs. Listed explicitly so that,
# aside from these, missing imports are still surfaced.
[mypy-faiss.*]
ignore_missing_imports = True

[mypy-langchain.*]
ignore_missing_imports = True

[mypy-langchain_community.*]
ignore_missing_imports = True

[mypy-langchain_openai.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

# Tests may use looser typing; keep them from blocking the gate for now.
[mypy-tests.*]
check_untyped_defs = False
disallow_untyped_defs = False
