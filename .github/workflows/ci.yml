name: Enterprise AI BI Platform CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

# Shared defaults so every job resolves imports from the repo root.
env:
  PYTHONPATH: .

jobs:
  # --------------------------------------------------------------------------
  # 1. Static quality gates — fast, no database required.
  #    Lint (ruff, blocking), format check (black, advisory) and static
  #    typing (mypy, advisory).
  # --------------------------------------------------------------------------

  lint-and-type:
    name: Lint, format & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/all.txt

      - name: Ruff lint
        run: ruff check .

      # Advisory only for now: the existing codebase predates black and would
      # need a bulk reformat (a dedicated PR) before this can block. Ruff
      # already enforces import ordering and the lint rules above. Flip to
      # blocking once a `black .` baseline PR has landed.
      - name: Black format check (advisory)
        continue-on-error: true
        run: black --check .

      # Advisory only for now: there is a backlog of pre-existing type errors
      # (schema duplication, a few Liskov/override mismatches in the copilot
      # agents). mypy.ini already establishes the config baseline; flip this to
      # blocking once a dedicated typing-cleanup PR has driven `mypy app` to
      # zero errors.
      - name: Mypy type check (advisory)
        continue-on-error: true
        run: mypy app


  # --------------------------------------------------------------------------
  # 2. Migration gate — proves the Phase 1 exit condition:
  #    a COMPLETELY EMPTY PostgreSQL database becomes the full schema ONLY
  #    through `alembic upgrade head`, and downgrades cleanly back to empty.
  #    No create_all() anywhere in this path.
  # --------------------------------------------------------------------------
  migrations:
    name: Alembic migrations (empty DB -> head -> base)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      SECRET_KEY: test-secret-key-for-ci-only-not-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: "*"
      MAX_UPLOAD_MB: "10"
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/all.txt

      - name: Upgrade an empty database to head
        run: alembic upgrade head

      - name: Assert schema is at head (no pending autogenerate diff)
        run: python -m pytest tests/test_migrations.py -v --tb=short

      - name: Downgrade back to base (full teardown)
        run: alembic downgrade base

      - name: Re-upgrade to head (idempotency / round-trip check)
        run: alembic upgrade head

  # --------------------------------------------------------------------------
  # 3. Test + coverage gate — full suite against a fresh migrated database.
  #    Coverage threshold is enforced (see .coveragerc / pyproject).
  # --------------------------------------------------------------------------
  tests:
    name: Tests & coverage
    runs-on: ubuntu-latest
    needs: [lint-and-type, migrations]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      SECRET_KEY: test-secret-key-for-ci-only-not-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: "*"
      MAX_UPLOAD_MB: "10"
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/all.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests --ignore=tests/manual \
            --cov=app --cov-report=term-missing --cov-report=xml -v --tb=short

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # 4. Dependency vulnerability audit — pinned requirements are scanned for
  #    known CVEs. Non-blocking today (continue-on-error) so it can be adopted
  #    incrementally, then flipped to blocking once the baseline is clean.
  # --------------------------------------------------------------------------
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1

      - name: Audit pinned dependencies
        continue-on-error: true
        run: |
          pip-audit -r requirements/base.txt -r requirements/ai.txt -r requirements/dev.txt
