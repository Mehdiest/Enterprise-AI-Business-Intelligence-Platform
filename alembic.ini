# Alembic configuration for the Enterprise AI Business Intelligence Platform.
#
# The database URL is intentionally NOT hard-coded here. It is resolved at
# runtime from the application settings (app.config.settings.database_url)
# inside alembic/env.py, so that migrations always target the same database
# the application uses and no secrets are committed to source control.

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Ensure the project root is importable so `import app...` works inside env.py.
prepend_sys_path = .

# Split path options on the OS separator (silences the legacy-splitting warning).
path_separator = os

# Template used to generate migration file names. A zero-padded, date-prefixed
# slug keeps revisions ordered and readable.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Use OS-native path separators when rendering paths.
# version_path_separator = os

# Timezone for timestamps rendered inside migrations.
# timezone = UTC

# Left blank on purpose: env.py injects the URL from application settings.
sqlalchemy.url =


# ============================================================================
# Logging configuration
# ============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
